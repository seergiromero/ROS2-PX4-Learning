# Configuration for the frontier_detector_3d node.
#
# This mirrors the configuration surface of the reference implementation of
# Batinovic et al., "A Multi-Resolution Frontier-Based Planner for Autonomous
# 3D Exploration" (IEEE RA-L 2021), larics/uav_frontier_exploration_3d.
#
# The frontier algorithm itself is fixed (incremental changed-cell detection,
# 26-neighbourhood, free cell with unknown neighbour and no occupied neighbour)
# and is not configurable. Only the four parameters below shape the result:
#   - resolution          octomap leaf size
#   - exploration_depth   octree level used for detection/clustering
#   - kernel_bandwidth    mean-shift bandwidth
#   - bounds_*            exploration bounding box
frontier_detector_3d:
  ros__parameters:
    # Inputs / outputs ------------------------------------------------------
    cloud_topic: /lidar_3d/points
    frontier_topic: /exploration/frontiers
    map_frame: map
    # False keeps cloud points and TF pose at the same time. Set true only if
    # the upstream system cannot provide a common clock; it can smear the map
    # while the vehicle moves.
    use_latest_transform: false
    publish_map: true
    process_rate_hz: 0.5

    # OctoMap model ---------------------------------------------------------
    resolution: 0.3
    point_subsample: 3
    sensor_model:
      # Hard map limit / free-space clearing distance in metres.
      max_range: 10.0
    compress_map: true

    # Multi-resolution detection --------------------------------------------
    # Octree level at which parent frontier cells are searched and clustered.
    # Octomap depth 16 is the finest leaf level; each step coarser halves the
    # detection resolution. Depth 15 -> cells of 2 x resolution = 0.6 m.
    exploration_depth: 15
    # Gaussian mean-shift bandwidth in metres. Higher bandwidth gives fewer,
    # larger clusters. Must be >= the parent cell size.
    clustering:
      kernel_bandwidth: 1.0
    # Noise filter (NOT in the paper): drop clusters with fewer than this many
    # parent cells. 2 removes the single-cell bubbles that appear at the LiDAR
    # FOV rim. Set to 1 to restore the exact reference behaviour.
    min_frontier_size: 2

    # Exploration box (map frame) -------------------------------------------
    # Frontiers outside this box are discarded, so no goals are published in
    # space the vehicle is not expected to visit.
    bounds_enabled: true
    min_x: -6.0
    max_x: 6.0
    min_y: -4.0
    max_y: 4.0
    min_z: 0.3
    max_z: 3.5

    # Visualization ---------------------------------------------------------
    publish_voxels: false
    publish_centroids: true
